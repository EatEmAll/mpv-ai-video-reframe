[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mpv-reframe"
version = "0.1.0"
description = "AI person-following crop extension for mpv"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.14.1+cu130; sys_platform != 'darwin'",
  "torch==2.14.1; sys_platform == 'darwin'",
  "torchvision==0.29.1+cu130; sys_platform != 'darwin'",
  "torchvision==0.29.1; sys_platform == 'darwin'",
  "ultralytics==8.4.193",
  "av==19.0.2",
  "python-mpv-jsonipc==1.5.0",
  "numpy>=2,<3",
  "lap==0.5.13",
]

[project.scripts]
reframe = "reframe.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.14",
    "psutil>=7",
    "nvidia-ml-py>=13.615",
    "hatchling==1.33.0",
]
spike = ["mpv>=1.0.8"]
accel = ["tensorrt-cu13==10.16.1.11; sys_platform == 'win32'", "onnx==1.23.2"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.hatch.build.targets.wheel]
packages = ["src/reframe"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
